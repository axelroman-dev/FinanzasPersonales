# Docker Compose para PRODUCCIÓN (homelab)
# Levanta la app Next.js (imagen privada de Docker Hub) + PostgreSQL.
# Se conecta a la red externa "proxy" para que nginx/cloudflared del homelab
# puedan llegar al contenedor por nombre (finanzas-app:3000), sin publicar
# el puerto en el host.
#
# La imagen se construye y publica sola en Docker Hub (repo privado
# axelroman-dev/finanzas_personales) vía GitHub Actions con cada push a main.
#
# Uso en el servidor:
#   docker network create proxy   # si todavía no existe
#   docker login                  # con tu usuario/token de Docker Hub (repo privado)
#   cp .env.prod.example .env
#   nano .env  # editar secretos (NEXTAUTH_SECRET, DB_PASSWORD) y NEXTAUTH_URL
#   docker compose pull && docker compose up -d   # traer última imagen + iniciar
#   docker compose logs -f app                     # ver logs
#   docker compose down                            # detener (sin borrar datos)
#   docker compose down -v                         # detener y BORRAR volúmenes
#
# Comandos npm equivalentes:
#   npm run prod:up      # pull + iniciar
#   npm run prod:logs    # tail de logs
#   npm run prod:reset   # detener + borrar + pull + iniciar

services:
  app:
    image: axelroman-dev/finanzas_personales:${IMAGE_TAG:-latest}
    container_name: finanzas-app
    restart: unless-stopped
    expose:
      - "3000"
    # Cargar el archivo .env automáticamente
    env_file:
      - .env
    environment:
      # Base de datos (compone con DB_PASSWORD del .env)
      DATABASE_URL: postgresql://finanzas:${DB_PASSWORD:?DB_PASSWORD requerido en .env}@db:5432/finanzas?schema=public
      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET requerido en .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Admin inicial (seed)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@finanzas.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      # Telemetry
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finanzas-net
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: finanzas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finanzas}
      POSTGRES_DB: finanzas
    volumes:
      - ${DATA_PATH:-/data}/finanzas/postgres:/var/lib/postgresql/data
    networks:
      - finanzas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  finanzas-net:
    driver: bridge
  proxy:
    external: true

volumes: {}