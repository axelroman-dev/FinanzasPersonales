services:
    postgres:
        image: postgres:16-alpine
        container_name: finanzas-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: finanzas
            POSTGRES_PASSWORD: finanzas
            POSTGRES_DB: finanzas
        ports:
            - "5433:5432"
        volumes:
            - finanzas_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    finanzas_pgdata:
        driver: local
