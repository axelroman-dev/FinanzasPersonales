name: CI

on:
    pull_request:
        branches: [main]

# Si haces otro push al mismo PR, cancela la corrida anterior
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Tests
              run: npm test

            - name: Build
              run: npm run build
              env:
                  NEXT_TELEMETRY_DISABLED: 1
